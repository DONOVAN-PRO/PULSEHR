<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Évaluation — PulseHR</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #1a1a1a;
        }

        /* Header & Navigation */
        header {
            background: #0a0a0a;
            width: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 4px;
            border: 1.5px solid #0a0a0a;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        /* Formulaires */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 600px;
        }

        form div {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: bold;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #0a0a0a;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button[type="submit"] {
            background-color: #0a0a0a;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 0.5rem;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #333333;
        }

        /* Gestion des erreurs Spring Validation */
        .field-error {
            color: #b91c1c;
            font-size: 0.85em;
            display: block;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
<header>
    <div th:replace="~{layout :: nav}"></div>
</header>

<div class="container">
    <h2>Nouvelle Évaluation</h2>
    <form th:action="@{/evaluations}" th:object="${evaluation}" method="post">
        <div>
            <label>Employé :</label>
            <select th:field="*{employeId}">
                <option th:each="e : ${employes}" th:value="${e.id}" th:text="${e.prenom + ' ' + e.nom}"></option>
            </select>
            <span class="field-error" th:errors="*{employeId}"></span>
        </div>
        <div>
            <label>Score (1 à 5) :</label>
            <input type="number" min="1" max="5" th:field="*{score}" />
            <span class="field-error" th:errors="*{score}"></span>
        </div>
        <div>
            <label>Période :</label>
            <input type="text" th:field="*{periode}" placeholder="ex: Q1 2026" />
            <span class="field-error" th:errors="*{periode}"></span>
        </div>
        <div>
            <label>Commentaire :</label>
            <textarea th:field="*{commentaire}"></textarea>
        </div>
        <button type="submit">Valider Évaluation</button>
    </form>
</div>
</body>
</html>
