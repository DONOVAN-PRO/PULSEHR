<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — PulseHR</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #1a1a1a;
        }

        /* Header & Navigation */
        header {
            background: #0a0a0a;
            width: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 4px;
            border: 1.5px solid #0a0a0a;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        /* Cartes d'indicateurs de performance (KPIs) */
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .kpi-card {
            padding: 1rem;
            background: #e8e8e8;
            flex: 1;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .kpi-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            color: #333;
        }

        .kpi-card p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Liste des statistiques */
        ul.stats-list {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        ul.stats-list li {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        ul.stats-list li:last-child {
            border-bottom: none;
        }

        /* Tableaux */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0a0a0a;
            color: white;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<header>
    <div th:replace="~{layout :: nav}"></div>
</header>

<div class="container">
    <h1>Tableau de Bord RH</h1>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Employés Actifs</h3>
            <p th:text="${stats.nombreEmployesActifs}">0</p>
        </div>
        <div class="kpi-card">
            <h3>Masse Salariale</h3>
            <p th:text="${stats.masseSalarialeTotale + ' FCFA'}">0 FCFA</p>
        </div>
        <div class="kpi-card">
            <h3>Score Moyen</h3>
            <p th:text="${stats.scoreMoyenEntreprise + ' / 5'}">0 / 5</p>
        </div>
    </div>

    <h3>Statistiques Avancées</h3>
    <ul class="stats-list">
        <li><span>Top Département :</span> <strong th:text="${stats.departementPlusGrand}">-</strong></li>
        <li><span>Contrats Expirant (< 60 jours) :</span> <strong th:text="${stats.tauxContratsExpirant60Jours + '%'}">0%</strong></li>
    </ul>

    <h3>Top 3 Employés</h3>
    <table>
        <thead>
        <tr><th>Nom</th><th>Prénom</th><th>Département</th><th>Score Moyen</th></tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${stats.top3Employes}">
            <td th:text="${emp.nom}"></td>
            <td th:text="${emp.prenom}"></td>
            <td th:text="${emp.departement}"></td>
            <td th:text="${emp.scoreMoyen}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
