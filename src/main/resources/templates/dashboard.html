<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — PulseHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #182A24;
            --paper: #F6F3EC;
            --card: #FFFFFF;
            --gold: #B8863B;
            --teal: #3C6E63;
            --line: #E1DCCC;
            --text: #1C1C1A;
            --text-muted: #736F5F;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--paper);
            color: var(--text);
        }

        h1, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }

        .container {
            max-width: 1000px;
            margin: 2.5rem auto;
            background: var(--card);
            padding: 2.25rem 2.5rem;
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(24, 42, 36, 0.04);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.75rem;
            font-size: 1.9rem;
        }

        h3 {
            margin-top: 2rem;
            margin-bottom: 0.85rem;
            font-size: 1.15rem;
        }

        /* Cartes KPI — barre d'accent plutôt que boîte uniforme */
        .kpi-container {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .kpi-card {
            flex: 1;
            padding: 1.1rem 1.25rem;
            background: var(--paper);
            border-left: 3px solid var(--gold);
            border-radius: 0 4px 4px 0;
        }

        .kpi-card:nth-child(2) { border-left-color: var(--teal); }
        .kpi-card:nth-child(3) { border-left-color: #7A6A9E; }

        .kpi-card h3 {
            margin: 0 0 0.4rem 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .kpi-card p {
            margin: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.9rem;
            font-weight: 500;
            color: var(--ink);
        }

        /* Liste des statistiques */
        ul.stats-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
            border-top: 1px solid var(--line);
        }

        ul.stats-list li {
            padding: 0.85rem 0.1rem;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        ul.stats-list li span {
            color: var(--text-muted);
            font-size: 0.94rem;
        }

        ul.stats-list li strong {
            font-weight: 600;
        }

        /* Tableaux */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
        }

        th {
            background: var(--ink);
            color: #FFFDF8;
            font-weight: 500;
            font-size: 0.88rem;
            border-bottom: 2px solid var(--gold);
        }

        tbody tr:hover {
            background-color: #FAF8F2;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        @media (max-width: 720px) {
            .container {
                margin: 1.25rem;
                padding: 1.5rem 1.25rem;
            }

            h1 { font-size: 1.55rem; }

            .kpi-container {
                flex-direction: column;
                gap: 0.85rem;
            }

            .kpi-card p { font-size: 1.6rem; }

            ul.stats-list li {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.2rem;
            }

            table { min-width: 480px; }

            th, td {
                padding: 9px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: nav}"></div>

<div class="container">
    <h1>Tableau de bord RH</h1>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Employés actifs</h3>
            <p th:text="${stats.nombreEmployesActifs}">0</p>
        </div>
        <div class="kpi-card">
            <h3>Masse salariale</h3>
            <p th:text="${stats.masseSalarialeTotale + ' FCFA'}">0 FCFA</p>
        </div>
        <div class="kpi-card">
            <h3>Score moyen</h3>
            <p th:text="${stats.scoreMoyenEntreprise + ' / 5'}">0 / 5</p>
        </div>
    </div>

    <h3>Statistiques avancées</h3>
    <ul class="stats-list">
        <li><span>Top département</span> <strong th:text="${stats.departementPlusGrand}">-</strong></li>
        <li><span>Contrats expirant (moins de 60 jours)</span> <strong th:text="${stats.tauxContratsExpirant60Jours + '%'}">0%</strong></li>
    </ul>

    <h3>Top 3 employés</h3>
    <div class="table-scroll">
        <table>
            <thead>
            <tr><th>Nom</th><th>Prénom</th><th>Département</th><th>Score moyen</th></tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${stats.top3Employes}">
                <td th:text="${emp.nom}"></td>
                <td th:text="${emp.prenom}"></td>
                <td th:text="${emp.departement}"></td>
                <td th:text="${emp.scoreMoyen}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
