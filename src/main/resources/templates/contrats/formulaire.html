<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau Contrat — PulseHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #182A24;
            --paper: #F6F3EC;
            --card: #FFFFFF;
            --gold: #B8863B;
            --line: #E1DCCC;
            --text: #1C1C1A;
            --text-muted: #736F5F;
            --error: #A6402F;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--paper);
            color: var(--text);
        }

        h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }

        .container {
            max-width: 640px;
            margin: 2.5rem auto;
            background: var(--card);
            padding: 2.25rem 2.5rem;
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(24, 42, 36, 0.04);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.75rem;
            font-size: 1.6rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        form div {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        select,
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--paper);
        }

        select:focus,
        input[type="number"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--card);
        }

        .actions {
            flex-direction: row;
            align-items: center;
            gap: 1rem;
            margin-top: 0.4rem;
        }

        button[type="submit"] {
            background-color: var(--ink);
            color: #FFFDF8;
            border: none;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            cursor: pointer;
            border-bottom: 2px solid var(--gold);
            transition: background-color 0.15s ease;
        }

        button[type="submit"]:hover {
            background-color: #24382F;
        }

        .cancel-link {
            color: var(--text-muted);
            font-size: 0.92rem;
            text-decoration: none;
            border-bottom: 1px solid var(--line);
        }

        .cancel-link:hover {
            color: var(--text);
            border-bottom-color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .container {
                margin: 1.25rem;
                padding: 1.5rem 1.25rem;
            }

            h1 { font-size: 1.35rem; }

            .actions {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            button[type="submit"] {
                width: 100%;
            }

            .cancel-link {
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: nav}"></div>

<div class="container">
    <h1>Créer un nouveau contrat</h1>

    <form th:action="@{/contrats}" th:object="${contrat}" method="post">
        <div>
            <label for="typeContrat">Type de contrat</label>
            <select id="typeContrat" th:field="*{typeContrat}" required>
                <option value="CDI">CDI</option>
                <option value="CDD">CDD</option>
                <option value="Stage">Stage</option>
                <option value="Alternance">Alternance</option>
            </select>
        </div>
        <div>
            <label for="salaire">Salaire mensuel</label>
            <input type="number" id="salaire" step="0.01" th:field="*{salaire}" required />
        </div>
        <div>
            <label for="dateDebut">Date de début</label>
            <input type="date" id="dateDebut" th:field="*{dateDebut}" required />
        </div>
        <div>
            <label for="dateFin">Date de fin (optionnel)</label>
            <input type="date" id="dateFin" th:field="*{dateFin}" />
        </div>
        <div class="actions">
            <button type="submit">Enregistrer le contrat</button>
            <a class="cancel-link" th:href="@{/contrats}">Annuler</a>
        </div>
    </form>
</div>
</body>
</html>
