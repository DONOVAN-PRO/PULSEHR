<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Employé — PulseHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #182A24;
            --paper: #F6F3EC;
            --card: #FFFFFF;
            --gold: #B8863B;
            --line: #E1DCCC;
            --text: #1C1C1A;
            --text-muted: #736F5F;
            --error: #A6402F;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--paper);
            color: var(--text);
        }

        h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }

        .container {
            max-width: 640px;
            margin: 2.5rem auto;
            background: var(--card);
            padding: 2.25rem 2.5rem;
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(24, 42, 36, 0.04);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.75rem;
            font-size: 1.6rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        form div {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--paper);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--card);
        }

        button[type="submit"] {
            background-color: var(--ink);
            color: #FFFDF8;
            border: none;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 0.4rem;
            border-bottom: 2px solid var(--gold);
            transition: background-color 0.15s ease;
        }

        button[type="submit"]:hover {
            background-color: #24382F;
        }

        .field-error {
            color: var(--error);
            font-size: 0.85em;
            display: block;
            margin-top: 0.15rem;
        }

        @media (max-width: 640px) {
            .container {
                margin: 1.25rem;
                padding: 1.5rem 1.25rem;
            }

            h2 { font-size: 1.35rem; }

            button[type="submit"] {
                width: 100%;
                align-self: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: nav}"></div>

<div class="container">
    <h2>Nouvel employé</h2>
    <form th:action="@{/employes}" th:object="${employe}" method="post">
        <div>
            <label>Nom</label>
            <input type="text" th:field="*{nom}" />
            <span class="field-error" th:errors="*{nom}"></span>
        </div>
        <div>
            <label>Prénom</label>
            <input type="text" th:field="*{prenom}" />
            <span class="field-error" th:errors="*{prenom}"></span>
        </div>
        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" />
            <span class="field-error" th:errors="*{email}"></span>
        </div>
        <div>
            <label>Poste</label>
            <select th:field="*{poste}">
                <option th:each="p : ${postes}" th:value="${p}" th:text="${p}"></option>
            </select>
            <span class="field-error" th:errors="*{poste}"></span>
        </div>
        <div>
            <label>Salaire</label>
            <input type="number" step="0.01" th:field="*{salaire}" />
            <span class="field-error" th:errors="*{salaire}"></span>
        </div>
        <div>
            <label>Date d'embauche</label>
            <input type="date" th:field="*{dateEmbauche}" />
            <span class="field-error" th:errors="*{dateEmbauche}"></span>
        </div>
        <div>
            <label>Département</label>
            <select th:field="*{departementId}">
                <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}"></option>
            </select>
            <span class="field-error" th:errors="*{departementId}"></span>
        </div>
        <button type="submit">Sauvegarder</button>
    </form>
</div>
</body>
</html>
