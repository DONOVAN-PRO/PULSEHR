<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employés — PulseHR</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #1a1a1a;
        }

        /* Header & Navigation */
        header {
            background: #0a0a0a;
            width: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 4px;
            border: 1.5px solid #0a0a0a;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        /* Bouton Action d'ajout */
        .btn-add {
            display: inline-block;
            background-color: #0a0a0a;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: background-color 0.2s ease;
        }

        .btn-add:hover {
            background-color: #333333;
        }

        /* Formulaire de filtrage en ligne */
        .filter-form {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #fafafa;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
        }

        .filter-form input[type="text"],
        .filter-form select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .filter-form input[type="text"] {
            flex: 2;
        }

        .filter-form select {
            flex: 1;
        }

        .filter-form button {
            background-color: #0a0a0a;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .filter-form button:hover {
            background-color: #333333;
        }

        /* Tableaux */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0a0a0a;
            color: white;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<header>
    <div th:replace="~{layout :: nav}"></div>
</header>

<div class="container">
    <h2>Liste des Employés</h2>
    <a th:href="@{/employes/nouveau}" class="btn-add">+ Créer un Employé</a>

    <form th:action="@{/employes}" method="get" class="filter-form">
        <input type="text" name="nom" placeholder="Recherche par nom..." />
        <select name="deptId">
            <option value="">Tous les départements</option>
            <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}"></option>
        </select>
        <button type="submit">Filtrer</button>
    </form>

    <table th:if="${!#lists.isEmpty(employes)}">
        <thead>
        <tr><th>Nom</th><th>Prénom</th><th>Email</th><th>Poste</th><th>Département</th><th>Statut Contrat</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${employes}">
            <td th:text="${e.nom}"></td>
            <td th:text="${e.prenom}"></td>
            <td th:text="${e.email}"></td>
            <td th:text="${e.poste}"></td>
            <td th:text="${e.nomDepartement}"></td>
            <td th:text="${e.statutContratActif}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
