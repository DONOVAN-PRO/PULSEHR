<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Départements — PulseHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #182A24;
            --paper: #F6F3EC;
            --card: #FFFFFF;
            --gold: #B8863B;
            --line: #E1DCCC;
            --text: #1C1C1A;
            --text-muted: #736F5F;
            --error: #A6402F;
            --error-bg: #FBF1EE;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--paper);
            color: var(--text);
        }

        h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }

        .container {
            max-width: 1000px;
            margin: 2.5rem auto;
            background: var(--card);
            padding: 2.25rem 2.5rem;
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(24, 42, 36, 0.04);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
        }

        /* Message d'alerte */
        .alert {
            padding: 12px 14px;
            background: var(--error-bg);
            border-left: 3px solid var(--error);
            color: var(--error);
            margin-bottom: 1.25rem;
            border-radius: 0 4px 4px 0;
        }

        /* Bouton Ajouter */
        .btn-add {
            display: inline-block;
            background-color: var(--ink);
            color: #FFFDF8;
            text-decoration: none;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
            border-bottom: 2px solid var(--gold);
            margin-bottom: 1.75rem;
            transition: background-color 0.15s ease;
        }

        .btn-add:hover {
            background-color: #24382F;
        }

        .empty-state {
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--paper);
            border-radius: 4px;
            border: 1px dashed var(--line);
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        /* Tableaux */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: var(--ink);
            color: #FFFDF8;
            font-weight: 500;
            font-size: 0.88rem;
            border-bottom: 2px solid var(--gold);
        }

        tbody tr:hover {
            background-color: #FAF8F2;
        }

        td a {
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid var(--gold);
        }

        td a:hover {
            color: var(--teal, #3C6E63);
        }

        /* Bouton Supprimer spécifique aux lignes du tableau */
        .btn-danger {
            background-color: transparent;
            color: var(--error);
            border: 1px solid var(--error);
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .btn-danger:hover {
            background-color: var(--error);
            color: #FFFDF8;
        }

        @media (max-width: 720px) {
            .container {
                margin: 1.25rem;
                padding: 1.5rem 1.25rem;
            }

            h2 { font-size: 1.35rem; }

            table { min-width: 560px; }

            th, td {
                padding: 9px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{layout :: nav}"></div>

<div class="container">
    <h2>Départements</h2>
    <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>
    <a th:href="@{/departements/nouveau}" class="btn-add">+ Créer un département</a>

    <div th:if="${#lists.isEmpty(departements)}" class="empty-state">
        <p>Aucun département trouvé. Créez-en un pour commencer !</p>
    </div>

    <div class="table-scroll">
        <table th:if="${!#lists.isEmpty(departements)}">
            <thead>
            <tr><th>Nom</th><th>Budget annuel</th><th>Localisation</th><th>Employés</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${departements}">
                <td><a th:href="@{/departements/{id}(id=${d.id})}" th:text="${d.nom}"></a></td>
                <td th:text="${d.budgetAnnuel}"></td>
                <td th:text="${d.localisation}"></td>
                <td th:text="${d.nombreEmployes}"></td>
                <td>
                    <form th:action="@{/departements/{id}/supprimer(id=${d.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
